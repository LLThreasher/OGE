name: CI - Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0

      - name: Configure
        run: cmake --preset x64-debug

      - name: Build
        run: cmake --build out/build/x64-debug

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir out/build/x64-debug -V --output-on-failure 2>&1 | ForEach-Object {
            if ($_ -match 'Exit code') { Write-Output "::error::$_" }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
