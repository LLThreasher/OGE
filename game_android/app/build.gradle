plugins {
     id 'com.android.application'
}

// def buildWithCMake = project.hasProperty('BUILD_WITH_CMAKE');
def buildWithCMake = true;

// Load CMake args from cmake_config.properties generated by the top-level
// CMake configure step, instead of receiving them all via -P command-line flags.
def extraArgs = []
def cmakeBuildDir = project.findProperty("CMAKE_BUILD_DIR")
if (cmakeBuildDir) {
    def propsFile = new File(cmakeBuildDir, "cmake_config.properties")
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        props.each { key, value ->
            extraArgs.add("-D${key}=${value}")
        }
        logger.info("Loaded ${extraArgs.size()} CMake args from ${propsFile.absolutePath}")
    } else {
        logger.warn("cmake_config.properties not found at ${propsFile.absolutePath}")
    }
} else {
    logger.warn("CMAKE_BUILD_DIR property not set; no extra CMake args will be passed")
}

// Provide Vulkan GLSLC and spirv-opt from the NDK as defaults.  If the
// top-level CMake already set these in cmake_config.properties, keep those
// values; otherwise fall back to the NDK shader-tools path.
if (!extraArgs.any { it.startsWith("-DVulkan_GLSLC_EXECUTABLE=") }) {
    try {
        def ndkDir = android.ndkDirectory
        def hostTag = System.getProperty("os.name").toLowerCase().contains("mac")
            ? "darwin-x86_64"
            : System.getProperty("os.name").toLowerCase().contains("win")
                ? "windows-x86_64"
                : "linux-x86_64"
        def glslcPath = "${ndkDir}/shader-tools/${hostTag}/glslc"
        extraArgs.add("-DVulkan_GLSLC_EXECUTABLE=${glslcPath}")
        def spirvOptPath = "${ndkDir}/shader-tools/${hostTag}/spirv-opt"
        extraArgs.add("-DVulkan_SPIRV_OPT_EXECUTABLE=${spirvOptPath}")
    } catch (Exception e) {
        logger.warn("NDK not available; skipping shader-tool defaults: ${e.message}")
    }
}

def versionNameFromCMake = project.findProperty("VERSION_NAME") ?: "0.1.0";
def versionCodeFromCMake = project.findProperty("VERSION_CODE") ?: "1";

def appName = project.findProperty("APP_NAME") ?: "OneGame";

android {
    signingConfigs {
        release {
            storeFile file("my-release-key.jks")
            storePassword "123456"
            keyAlias "one-game-engine"
            keyPassword "123456"
        }
    }

    namespace = "org.libsdl.app"
    compileSdk = 35
    ndkVersion = "28.2.13676358"
    defaultConfig {
        minSdkVersion 29
        targetSdkVersion 35
        versionCode versionCodeFromCMake.toInteger()
        versionName versionNameFromCMake
        resValue "string", "app_name", appName
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-29"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
            cmake {
                arguments "-DCMAKE_VERBOSE_MAKEFILE=ON"
                arguments "-DCMAKE_RULE_MESSAGES=OFF"
                arguments "-DANDROID_PLATFORM=android-29", "-DANDROID_STL=c++_static"
                arguments.addAll(extraArgs)
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            // Ensure no overriding configurations are forcing it to skip outputs
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets {
            debug {
                jniLibs.srcDir 'libs/debug'
            }
            release {
                jniLibs.srcDir 'libs/release'
            }
        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path 'jni/CMakeLists.txt'
                    version '3.28.0+'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
